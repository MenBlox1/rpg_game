version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bot_db
    restart: always
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: bot_rpg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: